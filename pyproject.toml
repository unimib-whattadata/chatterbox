[project]
name = "chatterbox-tts"
version = "0.1.6"
description = "Chatterbox: Open Source TTS and Voice Conversion by Resemble AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "numpy>=1.24.0,<2.0.0", "librosa==0.11.0", "s3tokenizer", "transformers==4.46.3", "diffusers==0.29.0", "resemble-perth==1.0.1", "conformer==0.3.2", "safetensors==0.5.3", "spacy-pkuseg", "pykakasi==2.3.0", "gradio==5.44.1", "pyloudnorm", "omegaconf",]
[[project.authors]]
name = "resemble-ai"
email = "engineering@resemble.ai"

[build-system]
requires = [ "setuptools>=61.0",]
build-backend = "setuptools.build_meta"

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/resemble-ai/chatterbox"
Repository = "https://github.com/resemble-ai/chatterbox"

[tool.setuptools.packages.find]
where = [ "src",]
